[package]
name = "plot-keys"
version = "0.1.0"
edition = "2021"
description = "Chia v2 plot ID and memo derivation for the browser"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chia-bls = "0.49.0"
sha2 = "0.10.9"
bech32 = "0.11"
hex = "0.4"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
